
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
   
    <title>Contenido incrustado en HTML</title>
    <style>
        h2{text-align: center}
    </style>
</head>
<body>

    <h1>Ejemplos de contenido incrustado en HTML</h1>

    

    <hr>

    <h2>1. Etiqueta img</h2>
    

    <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9epWwodqPd0Q5ZA8Qm6MDsj9YRh0k5szSl3HNJKeayQ&s"
        alt="Puerto de algeciras"
        width="400">

  

    <hr>

    <h2>2. Etiqueta iframe</h2>

    <iframe
        src="https://wikipedia  .org/"
        width="500"
        height="250"
        title="Página de ejemplo">
    </iframe>

    <hr>

    <h2>3. Etiqueta embed</h2>
    

    <embed
        src="Tema1_presentacion.pdf"
        type="application/pdf"
        width="500"
        height="300">

   

    <hr>

    <h2>4. Etiqueta object</h2>
    

    <object
        data="Tema1_presentacion.pdf"
        type="application/pdf"
        width="500"
        height="300">
        
    </object>

    <hr>

    <h2>5. Etiqueta video</h2>

    <video width="400" controls>
        <source
            src="https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
            type="video/mp4">
        
    </video>

    

    <hr>

    <h2>6. Etiqueta audio</h2>
    

    <audio controls>
        <source
            src="https://www.samplefiles.online/files/sample.mp3"
            type="audio/mpeg">
        
    </audio>

   

    <hr>

    <h2>7. Etiqueta source</h2>
    

    <video width="300" controls>
        <source
            src="https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4"
            type="video/mp4">
        
    </video>

    <hr>

    <h2>8. Etiqueta canvas</h2>
    

    <canvas id="miCanvas" width="300" height="150"
            style="border:1px solid black;">
    </canvas>

    

    <hr>

    <h2>9. Etiqueta svg</h2>
    

    <svg width="400" height="180">
    <rect x="50" y="20" width="300" height="100" style="fill:blue" />
  </svg>

    <hr>

    <h2>Volver al inicio</h2>

    <p>
        <a href="Ejercicio1.html">Volver a la página principal</a>
    </p>

</body>
</html>
